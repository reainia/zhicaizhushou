<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 客服 - 在线演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
    }
    .hero h1 {
      font-size: 32px;
      margin-bottom: 12px;
      color: #1a1a1a;
    }
    .hero p {
      font-size: 16px;
      color: #666;
      line-height: 1.7;
    }
    .hero .hint {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 15px;
    }
    .hero .hint strong {
      color: #1677ff;
    }
    .hero .hint .arrow {
      display: inline-block;
      font-size: 24px;
      margin: 0 8px;
      animation: bounceRight 1.5s ease-in-out infinite;
    }
    @keyframes bounceRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    .status-bar {
      margin-top: 40px;
      padding: 12px 24px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      border-radius: 8px;
      color: #389e0d;
      font-size: 14px;
    }
    .status-bar.error {
      background: #fff2f0;
      border-color: #ffccc7;
      color: #cf1322;
    }
    .status-bar.loading {
      background: #fffbe6;
      border-color: #ffe58f;
      color: #d48806;
    }
    .embed-info {
      margin-top: 32px;
      font-size: 13px;
      color: #999;
    }
    .embed-info code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>AI 客服系统</h1>
    <p>基于 RAG 的智能客服聊天组件 · 已集成 DeepSeek 大模型</p>
    
    <div class="hint">
      <span>请点击屏幕右下角的</span>
      <span class="arrow">👉</span>
      <strong>蓝色聊天按钮</strong>
      <span class="arrow">👈</span>
      <span>开始对话</span>
    </div>

    <div id="status" class="status-bar loading">正在加载聊天组件...</div>

    <div class="embed-info">
      嵌入代码：<code>&lt;chat-widget server-url="http://localhost:8005"&gt;&lt;/chat-widget&gt;</code>
    </div>
  </div>

  <!-- 引入聊天组件 -->
  <script type="module" src="./src/index.js"></script>
  <chat-widget server-url="http://localhost:8005" title="AI 客服助手"></chat-widget>

  <script>
    // 检测聊天组件是否加载成功
    setTimeout(() => {
      const status = document.getElementById('status');
      const widget = document.querySelector('chat-widget');
      if (widget && widget.shadowRoot) {
        const trigger = widget.shadowRoot.getElementById('trigger');
        if (trigger) {
          status.className = 'status-bar';
          status.innerHTML = '[OK] 聊天组件已加载，请在右下角找到蓝色按钮开始对话';
        } else {
          status.className = 'status-bar error';
          status.innerHTML = '[ERROR] 组件已加载但触发按钮未渲染，请检查浏览器控制台错误';
        }
      } else {
        status.className = 'status-bar error';
        status.innerHTML = '[ERROR] 聊天组件未加载。尝试：<strong>Ctrl+Shift+R</strong> 强制刷新页面';
      }
    }, 1000);
  </script>
</body>
</html>
